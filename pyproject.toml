[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoproof"
version = "0.1.0"
description = "Verifiable air-quality data with graph-based validation and Merkle anchoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2",
    "httpx>=0.28,<1",
    "duckdb>=1.4,<2",
    "matplotlib>=3.9,<4",
    "web3>=7,<8",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "gnumake==4.4.1; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --basetemp=.pytest_cache/tmp"
